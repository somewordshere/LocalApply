<html>
  <body>
    <!-- Approximations of each system's markup, reduced to the attributes the adapters rely on. -->
    <form id="greenhouse">
      <input id="first_name" name="job_application[first_name]" aria-label="x" />
      <input id="last_name" name="job_application[last_name]" aria-label="x" />
      <input id="email" name="job_application[email]" aria-label="x" />
      <input id="phone" name="job_application[phone]" aria-label="x" />
      <div data-field="resume"><input type="file" /></div>
      <div data-field="cover_letter"><input type="file" /></div>
      <label for="q1">LinkedIn Profile</label><input id="q1" name="job_application[answers_attributes][0][text_value]" />
    </form>

    <form id="lever">
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="org" />
      <input name="urls[LinkedIn]" />
      <input name="urls[GitHub]" />
      <input name="urls[Portfolio]" />
      <textarea name="comments"></textarea>
    </form>

    <form id="workday">
      <div data-automation-id="formField-legalNameSection_firstName">
        <label for="name--legalName--firstName">Given Name(s)</label>
        <input id="name--legalName--firstName" data-automation-id="legalNameSection_firstName" />
      </div>
      <div>
        <label for="name--legalName--lastName">Family Name</label>
        <input id="name--legalName--lastName" data-automation-id="legalNameSection_lastName" />
      </div>
      <input id="address--addressLine1" />
      <input id="address--city" />
      <input id="address--postalCode" />
      <input id="phoneNumber--phoneNumber" />
    </form>

    <form id="workday-experience">
      <div data-automation-id="workExperience-1">
        <div data-automation-id="formField-jobTitle"><label for="job1-title">Job Title</label><input id="job1-title" /></div>
        <div data-automation-id="formField-companyName"><label for="job1-company">Company</label><input id="job1-company" /></div>
        <div data-automation-id="formField-location"><label for="job1-location">Location</label><input id="job1-location" /></div>
        <div data-automation-id="formField-startDate"><label>From</label>
          <input id="job1-from-m" aria-label="Month" data-automation-id="dateSectionMonth-input" />
          <input id="job1-from-y" aria-label="Year" data-automation-id="dateSectionYear-input" /></div>
        <div data-automation-id="formField-endDate"><label>To</label>
          <input id="job1-to-m" aria-label="Month" data-automation-id="dateSectionMonth-input" />
          <input id="job1-to-y" aria-label="Year" data-automation-id="dateSectionYear-input" /></div>
        <div data-automation-id="formField-roleDescription"><label for="job1-desc">Role Description</label><textarea id="job1-desc"></textarea></div>
      </div>
      <div data-automation-id="workExperience-2">
        <div data-automation-id="formField-jobTitle"><label for="job2-title">Job Title</label><input id="job2-title" /></div>
        <div data-automation-id="formField-companyName"><label for="job2-company">Company</label><input id="job2-company" /></div>
        <div data-automation-id="formField-location"><label for="job2-location">Location</label><input id="job2-location" /></div>
        <div data-automation-id="formField-startDate"><label>From</label>
          <input id="job2-from-m" aria-label="Month" data-automation-id="dateSectionMonth-input" />
          <input id="job2-from-y" aria-label="Year" data-automation-id="dateSectionYear-input" /></div>
        <div data-automation-id="formField-endDate"><label>To</label>
          <input id="job2-to-m" aria-label="Month" data-automation-id="dateSectionMonth-input" />
          <input id="job2-to-y" aria-label="Year" data-automation-id="dateSectionYear-input" /></div>
        <div data-automation-id="formField-roleDescription"><label for="job2-desc">Role Description</label><textarea id="job2-desc"></textarea></div>
      </div>
      <div data-automation-id="workExperience-3">
        <div data-automation-id="formField-jobTitle"><label for="job3-title">Job Title</label><input id="job3-title" /></div>
        <div data-automation-id="formField-companyName"><label for="job3-company">Company</label><input id="job3-company" /></div>
        <div data-automation-id="formField-location"><label for="job3-location">Location</label><input id="job3-location" /></div>
        <div data-automation-id="formField-startDate"><label>From</label>
          <input id="job3-from-m" aria-label="Month" data-automation-id="dateSectionMonth-input" />
          <input id="job3-from-y" aria-label="Year" data-automation-id="dateSectionYear-input" /></div>
        <div data-automation-id="formField-endDate"><label>To</label>
          <input id="job3-to-m" aria-label="Month" data-automation-id="dateSectionMonth-input" />
          <input id="job3-to-y" aria-label="Year" data-automation-id="dateSectionYear-input" /></div>
        <div data-automation-id="formField-roleDescription"><label for="job3-desc">Role Description</label><textarea id="job3-desc"></textarea></div>
      </div>
      <div data-automation-id="education-1">
        <div data-automation-id="formField-schoolName"><label for="edu-school">School or University</label><input id="edu-school" /></div>
        <div data-automation-id="formField-degree"><label for="edu-degree">Degree</label>
          <select id="edu-degree"><option value="">Select One</option><option>Bachelor's Degree</option><option>Master's Degree</option></select></div>
        <div data-automation-id="formField-fieldOfStudy"><label for="edu-field">Field of Study</label><input id="edu-field" /></div>
        <div data-automation-id="formField-firstYearAttended"><label for="edu-from">First Year Attended</label><input id="edu-from" /></div>
        <div data-automation-id="formField-lastYearAttended"><label for="edu-to">Last Year Attended</label><input id="edu-to" /></div>
      </div>
    </form>

    <form id="ashby">
      <input id="_systemfield_name" name="_systemfield_name" />
      <input id="_systemfield_email" name="_systemfield_email" />
    </form>

    <form id="personio">
      <input name="first_name" />
      <input name="last_name" />
      <input name="email" />
      <input name="phone" />
      <input name="available_from" />
      <input name="salary_expectations" />
    </form>
  </body>
</html>
